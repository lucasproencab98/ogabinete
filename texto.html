<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Vazia</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<nav class="nav-topo">
  <a href="index.html" class="nav-logo">Sala Vazia</a>
  <div class="nav-links">
    <a href="acervo.html">Acervo</a>
    <a href="sobre.html">Sobre</a>
  </div>
</nav>

<div class="container" id="conteudo">
  <!-- preenchido via JS -->
</div>

<script src="js/dados.js"></script>
<script>
  function formatarDataLonga(dataStr){
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const d = new Date(dataStr + 'T00:00:00');
    return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  carregarTextos().then(textos => {
    const ordenados = textos.sort((a, b) => new Date(b.data) - new Date(a.data));
    const indice = ordenados.findIndex(t => t.id === id);
    const texto = ordenados[indice];
    const container = document.getElementById('conteudo');

    if (!texto) {
      container.innerHTML = `
        <div class="texto-cabecalho">
          <p class="texto-titulo" style="font-size:1.8rem;">Página não encontrada</p>
          <p><a href="acervo.html">← voltar ao acervo</a></p>
        </div>`;
      return;
    }

    const anterior = ordenados[indice + 1];
    const proximo = ordenados[indice - 1];

    document.title = `${texto.titulo} — Sala Vazia`;

    container.innerHTML = `
      <div class="texto-cabecalho">
        <span class="texto-tipo">${texto.tipo}</span>
        <h1 class="texto-titulo">${texto.titulo}</h1>
        <div class="texto-data">${formatarDataLonga(texto.data)}</div>
      </div>

      <div class="ornamento">
        <div class="linha"></div><div class="losango"></div><div class="linha"></div>
      </div>

      <div class="texto-corpo">
        ${texto.corpo.map((p, i) => `<p class="${i === 0 ? 'capitular' : ''}">${p}</p>`).join('')}
      </div>

      <div class="texto-navegacao">
        <span>${anterior ? `<a href="texto.html?id=${anterior.id}">← ${anterior.titulo}</a>` : ''}</span>
        <span>${proximo ? `<a href="texto.html?id=${proximo.id}">${proximo.titulo} →</a>` : ''}</span>
      </div>

      <div class="rodape"><a href="acervo.html">voltar ao acervo</a></div>
    `;
  });
</script>

</body>
</html>
